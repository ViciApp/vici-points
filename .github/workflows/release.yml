name: Release

on:
  push:
    tags:
      - v*
  release:
    types: [released]
  workflow_dispatch:

permissions: {}

jobs:
  wasm:
    name: Build WASM
    runs-on: ubuntu-24.04
    concurrency:
      group: release-wasm-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Build
        run: npm run build

      - name: Upload minter.wasm.gz
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: minter.wasm.gz
          path: ./target/wasm32-unknown-unknown/release/minter.wasm.gz

      - name: Gzip external WASMs
        run: |
          gzip -c target/ic/ledger.wasm > target/ic/ledger.wasm.gz
          gzip -c target/ic/index.wasm > target/ic/index.wasm.gz

      - name: Upload ledger.wasm.gz
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ledger.wasm.gz
          path: ./target/ic/ledger.wasm.gz

      - name: Upload index.wasm.gz
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: index.wasm.gz
          path: ./target/ic/index.wasm.gz

      - name: Upload ledger.did
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ledger.did
          path: ./target/ic/ledger.did

      - name: Upload index.did
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: index.did
          path: ./target/ic/index.did

  candid:
    name: Generate Candid
    runs-on: ubuntu-24.04
    concurrency:
      group: release-candid-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: minter.did
            target: minter

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 'Upload ${{ matrix.name }}'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.name }}
          path: ./src/${{ matrix.target }}/${{ matrix.name }}

  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # Required to create/update the GitHub Release and/or upload release assets.
    needs: ['wasm', 'candid']
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download minter.wasm.gz
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: minter.wasm.gz
          path: .

      - name: Download minter.did
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: minter.did
          path: .

      - name: Download ledger.wasm.gz
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ledger.wasm.gz
          path: .

      - name: Download ledger.did
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ledger.did
          path: .

      - name: Download index.wasm.gz
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: index.wasm.gz
          path: .

      - name: Download index.did
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: index.did
          path: .

      - name: Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./minter.wasm.gz
            ./minter.did
            ./ledger.wasm.gz
            ./ledger.did
            ./index.wasm.gz
            ./index.did
