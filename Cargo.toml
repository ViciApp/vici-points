[workspace]
members = [
    "src/minter"
]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2021"

[workspace.dependencies]
ic-cdk = "0.20"
ic-cdk-timers = "1"
candid = "0.10"
icrc-ledger-types = "0.2"
serde = { version = "1", features = ["derive"] }
pocket-ic = "16.1"

[workspace.lints.rust]
warnings = "deny"
unused_attributes = "deny"
redundant_imports = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
enum_glob_use = "deny"
single_component_path_imports = "warn"
absolute_paths = "deny"
allow_attributes = "deny"
std_instead_of_core = "deny"
unseparated_literal_suffix = "deny"
redundant_test_prefix = "deny"
str_to_string = "deny"
string_add = "deny"
suspicious_xor_used_as_pow = "deny"
# Size and smell gate: limits in clippy.toml, existing excess pinned with #[expect] (see docs/ai/pr-and-ci.md).
cognitive_complexity = "deny"
too_many_arguments = "deny"
excessive_nesting = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
unnecessary_wraps = { level = "allow", priority = 1 }
format_push_string = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
